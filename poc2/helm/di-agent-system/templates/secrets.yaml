{{- if .Values.demoSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.influxdb.existingSecret }}
type: Opaque
stringData:
  admin-user: demo-admin
  admin-password: demo-influx-password
  admin-token: demo-influx-token
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.grafana.existingSecret }}
type: Opaque
stringData:
  admin-user: demo-admin
  admin-password: demo-grafana-password
{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.existingSecret }}
type: Opaque
stringData:
  username: di
  password: demo-postgres-password
{{- end }}
{{- end }}
