# Centralizes credentials so they aren't duplicated in plaintext across
# multiple Deployment specs; override these values via --set or a separate,
# untracked values file rather than editing values.yaml directly.
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-credentials
  labels:
    app.kubernetes.io/part-of: di-agent-system
type: Opaque
stringData:
  admin-user: {{ .Values.influxdb.adminUser | quote }}
  admin-password: {{ .Values.influxdb.adminPassword | quote }}
  admin-token: {{ .Values.influxdb.adminToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  labels:
    app.kubernetes.io/part-of: di-agent-system
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ .Values.grafana.adminPassword | quote }}
