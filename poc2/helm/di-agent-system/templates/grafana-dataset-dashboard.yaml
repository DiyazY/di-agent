{{- $bucket := .Values.influxdb.bucket | quote }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-engine-dataset-dashboard
  labels:
    app: grafana
data:
  engine-dataset.json: |
    {
      "uid": "engine-dataset",
      "title": "Engine dataset telemetry",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "annotations": { "list": [] },
      "templating": {
        "list": [
          {{- range $index, $tag := list "run_id" "signal" "source" "origin" }}
          {{- if $index }},{{ end }}
          {
            "name": {{ $tag | toJson }},
            "label": {{ $tag | toJson }},
            "type": "query",
            "datasource": { "type": "influxdb", "uid": "di-agent-influxdb" },
            "query": {{ printf "import \"influxdata/influxdb/schema\"\nschema.tagValues(bucket: %s, tag: %q, predicate: (r) => r._measurement == \"dataset_timeseries\", start: v.timeRangeStart)" $bucket $tag | toJson }},
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "current": { "text": "All", "value": "$__all" }
          }
          {{- end }}
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Dataset values (window-averaged, emission time)",
          "description": "From raw telemetry; Grafana averages points per display window. Values are dataset-native unless explicit metadata says otherwise. Observed bounds are not physical operating limits. The agent averages samples separately.",
          "gridPos": { "h": 16, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "influxdb", "uid": "di-agent-influxdb" },
          "targets": [
            {
              "refId": "A",
              "query": {{ printf "from(bucket: %s)\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"dataset_timeseries\" and r._field == \"value\")\n  |> filter(fn: (r) => r.run_id =~ /^${run_id:regex}$/ and r.signal =~ /^${signal:regex}$/ and r.source =~ /^${source:regex}$/ and r.origin =~ /^${origin:regex}$/)\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> yield(name: \"mean\")" $bucket | toJson }}
            }
          ]
        }
      ]
    }
