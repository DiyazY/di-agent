{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: di-agent
  labels:
    app: di-agent
spec:
  selector:
    matchLabels:
      app: di-agent
  template:
    metadata:
      labels:
        app: di-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
      {{- include "diagent.nodeSelector" (dict "local" .Values.agent.nodeSelector "global" .Values.global.nodeSelector) | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.datasetCollector.enabled .Values.agent.datasetNodeName }}
      initContainers:
        - name: wait-for-dataset-collector
          image: {{ include "diagent.customImage" (dict "global" .Values.global "image" .Values.agent.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ "${NODE_ID}" != "${DATASET_NODE_NAME}" ]; then
                exit 0
              fi
              until curl --fail --silent --show-error --connect-timeout 2 --max-time 3 \
                http://dataset-collector:8000/ready; do
                echo "Waiting for dataset-collector readiness before starting di-agent"
                sleep 2
              done
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DATASET_NODE_NAME
              value: {{ .Values.agent.datasetNodeName | quote }}
      {{- end }}
      containers:
        - name: di-agent
          image: {{ include "diagent.customImage" (dict "global" .Values.global "image" .Values.agent.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: REGIME
              value: {{ .Values.agent.regime | quote }}
            - name: PROFILE
              value: {{ .Values.agent.profile | quote }}
            - name: PORT
              value: {{ .Values.agent.port | quote }}
            - name: COLLECT_INTERVAL
              value: {{ .Values.agent.collectInterval | quote }}
            - name: PROPOSER
              value: {{ .Values.agent.proposer | quote }}
            - name: REVIEW_LEVEL
              value: {{ .Values.agent.review.level | quote }}
            - name: REVIEW_RULES
              value: {{ join "," .Values.agent.review.rules | quote }}
            - name: DECISION_BACKEND
              value: {{ .Values.agent.review.decisionBackend | quote }}
            - name: REASONING_BACKEND
              value: {{ .Values.agent.review.reasoningBackend | quote }}
            - name: NETDATA_URL
              value: ""
            - name: KAFKA_BROKERS
              value: "kafka:{{ .Values.kafka.port }}"
            - name: CGROUP_ROOT
              value: /host/cgroup
            - name: UI
              value: {{ .Values.agent.ui | quote }}
            {{- if .Values.datasetCollector.enabled }}
            - name: DATASET_NODE_NAME
              value: {{ .Values.agent.datasetNodeName | quote }}
            - name: DATASET_COLLECTOR_URL
              value: "http://dataset-collector:8000/collect"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.agent.port }}
          volumeMounts:
            - name: agent-state
              mountPath: /var/lib/di-agent
            - name: host-cgroup
              mountPath: /host/cgroup
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: agent-state
          hostPath:
            path: {{ dig "persistence" "hostPath" "/var/lib/di-agent-v6" .Values.agent | quote }}
            type: DirectoryOrCreate
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: di-agent
  labels:
    app: di-agent
spec:
  type: ClusterIP
  selector:
    app: di-agent
  ports:
    - name: http
      port: {{ .Values.agent.port }}
      targetPort: http
{{- end }}
