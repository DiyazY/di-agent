# switchboard-service.yaml — stable in-cluster DNS name/port for the
# switchboard pod (no template placeholders: selector/port match
# switchboard-deployment.yaml).
apiVersion: v1
kind: Service
metadata:
  name: switchboard
  labels:
    app: switchboard
spec:
  selector:
    app: switchboard
  ports:
    - port: 8000
      targetPort: 8000
