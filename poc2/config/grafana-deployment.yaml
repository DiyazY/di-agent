# grafana-deployment.yaml.tmpl — ConfigMap + Deployment manifests for
# scripts/08-grafana.sh. Rendered with `envsubst` before being applied via
# kubectl; placeholders are populated from config/.env plus values
# resolved at deploy time (GRAFANA_VM, INFLUXDB_URL).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  influxdb.yaml: |
    apiVersion: 1
    datasources:
      - name: InfluxDB
        type: influxdb
        access: proxy
        url: ${INFLUXDB_URL}
        isDefault: true
        jsonData:
          version: Flux
          organization: ${INFLUXDB_ORG}
          defaultBucket: ${INFLUXDB_BUCKET}
          httpHeaderName1: Authorization
        secureJsonData:
          httpHeaderValue1: Token ${INFLUXDB_ADMIN_TOKEN}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${GRAFANA_VM}
      hostNetwork: true
      containers:
        - name: grafana
          image: ${GRAFANA_IMAGE}:${GRAFANA_IMAGE_TAG}
          imagePullPolicy: Never
          ports:
            - containerPort: ${GRAFANA_PORT}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "${GRAFANA_ADMIN_USER}"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "${GRAFANA_ADMIN_PASSWORD}"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
