# auxload-service.yaml.tmpl — stable in-cluster DNS name/port for a single
# auxiliary-load pod (selector matches only that instance's auxload-id, so
# multiple instances each get their own addressable Service; see
# auxload-deployment.yaml and scripts/06d-auxload.sh). Rendered with
# `envsubst` once per instance; AUXLOAD_NAME/AUXLOAD_ID default to "auxload".
apiVersion: v1
kind: Service
metadata:
  name: ${AUXLOAD_NAME}
  labels:
    app: auxload
    auxload-id: ${AUXLOAD_ID}
spec:
  selector:
    auxload-id: ${AUXLOAD_ID}
  ports:
    - port: 8000
      targetPort: 8000
