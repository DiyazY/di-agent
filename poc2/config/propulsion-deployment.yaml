# propulsion-deployment.yaml.tmpl — Kubernetes Deployment manifest for
# scripts/06b-propulsion.sh. Rendered with `envsubst` before being applied via
# kubectl, once per propulsion instance; placeholders are populated from
# config/.env plus values resolved at deploy time (PROPULSION_NAME,
# PROPULSION_ID, PROPULSION_VM, KAFKA_BROKERS). The propulsion drive
# requests power from, and is allocated power by, the switchboard (see
# scripts/06a-switchboard.sh) rather than reading genset telemetry directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${PROPULSION_NAME}
  labels:
    app: propulsion
    propulsion-id: ${PROPULSION_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      propulsion-id: ${PROPULSION_ID}
  template:
    metadata:
      labels:
        app: propulsion
        propulsion-id: ${PROPULSION_ID}
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${PROPULSION_VM}
      containers:
        - name: propulsion
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: PROPULSION_ID
              value: "${PROPULSION_ID}"
            - name: PROPULSION_PRIORITY
              value: "${PROPULSION_PRIORITY}"
            - name: KAFKA_BROKERS
              value: "${KAFKA_BROKERS}"
            - name: KAFKA_TOPIC
              value: "${KAFKA_TOPIC}"
            - name: REQUEST_KAFKA_TOPIC
              value: "${REQUEST_KAFKA_TOPIC}"
            - name: ALLOCATION_KAFKA_TOPIC
              value: "${ALLOCATION_KAFKA_TOPIC}"
