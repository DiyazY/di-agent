# propulsion-deployment.yaml.tmpl — Kubernetes Deployment manifest for
# scripts/06b-propulsion.sh. Rendered with `envsubst` before being applied via
# kubectl; placeholders are populated from config/.env plus values
# resolved at deploy time (PROPULSION_VM, KAFKA_BROKERS). The propulsion
# drive requests power from, and is allocated power by, the switchboard
# (see scripts/06a-switchboard.sh) rather than reading genset telemetry
# directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: propulsion
  labels:
    app: propulsion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: propulsion
  template:
    metadata:
      labels:
        app: propulsion
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${PROPULSION_VM}
      containers:
        - name: propulsion
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BROKERS
              value: "${KAFKA_BROKERS}"
            - name: KAFKA_TOPIC
              value: "${KAFKA_TOPIC}"
            - name: REQUEST_KAFKA_TOPIC
              value: "${REQUEST_KAFKA_TOPIC}"
            - name: ALLOCATION_KAFKA_TOPIC
              value: "${ALLOCATION_KAFKA_TOPIC}"
