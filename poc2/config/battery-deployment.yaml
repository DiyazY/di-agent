# battery-deployment.yaml.tmpl — Kubernetes Deployment manifest for
# scripts/06c-battery.sh. Rendered with `envsubst` before being applied via
# kubectl, once per battery instance; placeholders are populated from
# config/.env plus values resolved at deploy time (BATTERY_NAME, BATTERY_ID,
# BATTERY_VM, KAFKA_BROKERS). BATTERY_NAME/BATTERY_ID default to "battery"
# for a single-instance deployment, and to "battery-<N>" when
# scripts/06c-battery.sh loops over BATTERY_COUNT instances. The battery
# publishes power like a genset (see 06-genset.sh); the switchboard sums
# both into available bus supply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${BATTERY_NAME}
  labels:
    app: battery
    battery-id: ${BATTERY_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      battery-id: ${BATTERY_ID}
  template:
    metadata:
      labels:
        app: battery
        battery-id: ${BATTERY_ID}
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${BATTERY_VM}
      containers:
        - name: battery
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: BATTERY_ID
              value: "${BATTERY_ID}"
            - name: KAFKA_BROKERS
              value: "${KAFKA_BROKERS}"
            - name: KAFKA_TOPIC
              value: "${KAFKA_TOPIC}"
