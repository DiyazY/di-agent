# propulsion-service.yaml.tmpl — stable in-cluster DNS name/port for a
# single propulsion pod (selector matches only that instance's
# propulsion-id, so multiple propulsion instances each get their own
# addressable Service; see propulsion-deployment.yaml and
# scripts/06b-propulsion.sh). Rendered with `envsubst` once per instance;
# PROPULSION_NAME/PROPULSION_ID default to "propulsion".
apiVersion: v1
kind: Service
metadata:
  name: ${PROPULSION_NAME}
  labels:
    app: propulsion
    propulsion-id: ${PROPULSION_ID}
spec:
  selector:
    propulsion-id: ${PROPULSION_ID}
  ports:
    - port: 8000
      targetPort: 8000
