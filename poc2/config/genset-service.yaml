# genset-service.yaml.tmpl — stable in-cluster DNS name/port for a single
# genset pod (selector matches only that instance's genset-id, so multiple
# genset instances each get their own addressable Service; see
# genset-deployment.yaml and scripts/06-genset.sh). Rendered with `envsubst`
# once per instance; GENSET_NAME/GENSET_ID default to "genset".
apiVersion: v1
kind: Service
metadata:
  name: ${GENSET_NAME}
  labels:
    app: genset
    genset-id: ${GENSET_ID}
spec:
  selector:
    genset-id: ${GENSET_ID}
  ports:
    - port: 8000
      targetPort: 8000
