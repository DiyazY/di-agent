# kafka-deployment.yaml.tmpl — Kubernetes Deployment manifest for
# scripts/03-kafka.sh. Rendered with `envsubst` before being applied via
# kubectl; placeholders are populated from config/.env plus values
# resolved at deploy time (KAFKA_VM, CP_IP).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${KAFKA_VM}
      hostNetwork: true
      containers:
        - name: kafka
          image: ${KAFKA_IMAGE}:${KAFKA_IMAGE_TAG}
          imagePullPolicy: Never
          ports:
            - containerPort: ${KAFKA_PORT}
            - containerPort: 9093
          env:
            # apache/kafka (official image) maps KAFKA_* env vars straight to
            # server.properties keys — no bitnami-style KAFKA_CFG_ prefix.
            - name: CLUSTER_ID
              value: "${KAFKA_CLUSTER_ID}"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@${CP_IP}:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:${KAFKA_PORT},CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://${CP_IP}:${KAFKA_PORT}"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: kafka-data
          emptyDir: {}
