# auxload-deployment.yaml.tmpl — Kubernetes Deployment manifest for
# scripts/06d-auxload.sh. Rendered with `envsubst` before being applied via
# kubectl, once per auxiliary-load instance; placeholders are populated
# from config/.env plus values resolved at deploy time (AUXLOAD_NAME,
# AUXLOAD_ID, AUXLOAD_VM, KAFKA_BROKERS). The auxiliary (hotel) load
# requests power from, and is allocated power by, the switchboard (see
# scripts/06a-switchboard.sh), same as propulsion, and its target load
# ratio is adjustable via API just like propulsion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${AUXLOAD_NAME}
  labels:
    app: auxload
    auxload-id: ${AUXLOAD_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      auxload-id: ${AUXLOAD_ID}
  template:
    metadata:
      labels:
        app: auxload
        auxload-id: ${AUXLOAD_ID}
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${AUXLOAD_VM}
      containers:
        - name: auxload
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: AUXLOAD_ID
              value: "${AUXLOAD_ID}"
            - name: INITIAL_LOAD_RATIO
              value: "${INITIAL_LOAD_RATIO}"
            - name: KAFKA_BROKERS
              value: "${KAFKA_BROKERS}"
            - name: KAFKA_TOPIC
              value: "${KAFKA_TOPIC}"
            - name: REQUEST_KAFKA_TOPIC
              value: "${REQUEST_KAFKA_TOPIC}"
            - name: ALLOCATION_KAFKA_TOPIC
              value: "${ALLOCATION_KAFKA_TOPIC}"
