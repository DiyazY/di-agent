# influxdb-deployment.yaml.tmpl — Kubernetes Deployment manifest for
# scripts/07-influxdb.sh. Rendered with `envsubst` before being applied via
# kubectl; placeholders are populated from config/.env plus values
# resolved at deploy time (INFLUXDB_VM).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  labels:
    app: influxdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${INFLUXDB_VM}
      hostNetwork: true
      containers:
        - name: influxdb
          image: ${INFLUXDB_IMAGE}:${INFLUXDB_IMAGE_TAG}
          imagePullPolicy: Never
          ports:
            - containerPort: ${INFLUXDB_PORT}
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: "setup"
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: "${INFLUXDB_ADMIN_USER}"
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              value: "${INFLUXDB_ADMIN_PASSWORD}"
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: "${INFLUXDB_ORG}"
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: "${INFLUXDB_BUCKET}"
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              value: "${INFLUXDB_ADMIN_TOKEN}"
          volumeMounts:
            - name: influxdb-data
              mountPath: /var/lib/influxdb2
      volumes:
        - name: influxdb-data
          emptyDir: {}
