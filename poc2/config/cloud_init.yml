#cloud-config

# Install and enable SSH server
packages:
  - openssh-server
  - python3-pip
  - build-essential
  - cmake

# Required: Add SSH public key for key-based auth (more secure)
ssh_authorized_keys:
  - ssh-ed25519

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    # Password is "12345678" - CHANGE THIS!
    passwd: 12345678
    lock_passwd: false
    ssh_pwauth: true
    chpasswd:
      expire: false
    ssh_authorized_keys:
      - ssh-ed25519

# Set timezone
timezone: UTC
