name: CI

# Runs on every push to main and every PR targeting main.
# Validates that the semantic-map Go module builds, vets clean, and that
# the full test suite (compliance + scenarios + evolution + integration)
# passes with race detection on. Also runs the poc2/system pytest suite, the
# stubbed playground Cypress suite, and kind-based deployment and telemetry
# E2E tests against an ephemeral in-runner cluster.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-check:
    name: Terraform and Helm checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Check and validate Terraform roots
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
        run: |
          set -euo pipefail
          for root in poc2/cloud/eks poc2/infra/libvirt; do
            terraform fmt -check -diff -recursive "$root"
            terraform -chdir="$root" init -backend=false -input=false -no-color
            terraform -chdir="$root" validate -no-color
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint and render Helm profiles
        run: |
          set -euo pipefail
          chart=poc2/helm/di-agent-system
          helm lint "$chart"
          helm lint "$chart" -f poc2/cloud/helm-values.yaml

  test:
    name: build + test + vet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: semantic-map/go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: semantic-map/go/go.mod
          cache: true
          cache-dependency-path: semantic-map/go/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod / go.sum need 'go mod tidy'"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector, 5m timeout)
        run: go test -race -timeout 5m ./...

      - name: Test real agent peer recommendations
        run: |
          go build -o "$RUNNER_TEMP/di-agent-peer-e2e" ./cmd/agent
          python3 ../tests/peer_e2e.py "$RUNNER_TEMP/di-agent-peer-e2e"

      # The example plugin is certified by the same suite every Go collector
      # passes, through the agent's real exec adapter. Linux only: it reads /proc.
      - name: Certify example collector plugin (loadavg)
        run: go run ./cmd/mapctl collector check --exec ../examples/collectors/loadavg/loadavg.py

      # The shell template from docs/collectors.md, so the guide's smallest example
      # is held to the same rule as the others.
      - name: Certify example collector plugin (shell)
        run: go run ./cmd/mapctl collector check --exec ../examples/collectors/shell/load1.sh

      # The Python SDK's own unit tests: standard library unittest, no install.
      - name: Test Python collector SDK
        working-directory: semantic-map/sdk/python
        run: python3 -m unittest -v test_di_collector

  demo:
    name: dev.sh demo (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    defaults:
      run:
        working-directory: semantic-map/go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: semantic-map/go/go.mod
          cache: true
          cache-dependency-path: semantic-map/go/go.sum

      - name: Run guided demo in paper mode
        run: ./dev.sh demo --paper

  system-tests:
    name: poc2/system pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: poc2/system/**/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          for req in poc2/system/*/requirements.txt; do
            pip install -r "$req"
          done

      - name: Run pytest
        run: pytest poc2/system/

  playground-tests:
    name: poc2/playground Cypress suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: poc2/playground/package-lock.json

      - name: Install dependencies
        working-directory: poc2/playground
        run: npm ci

      - name: Build playground
        working-directory: poc2/playground
        run: npm run build

      - name: Run stubbed Cypress suite
        working-directory: poc2/playground
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite preview --host 0.0.0.0 > /tmp/playground-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              npm run cy:run
              exit 0
            fi
            sleep 1
          done
          cat /tmp/playground-preview.log
          echo "::error::playground preview server did not become ready"
          exit 1

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playground-cypress-failure
          path: poc2/playground/cypress/screenshots/
          if-no-files-found: ignore

  kind-smoke-test:
    name: kind Helm smoke test (di-agent-system chart, ${{ matrix.credentials }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        credentials: [demo, external]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          cluster_name: di-agent-smoke
          config: poc2/config/kind-agent-smoke.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Test agent deployment and peer registration
        run: python3 poc2/scripts/test_agent_deployment.py

      - name: Test playground chart rendering
        run: python3 poc2/scripts/test_playground_deployment.py

      - name: Test telemetry E2E retry and isolation checks
        run: python3 -m unittest discover -s poc2/scripts -p test_e2e_telemetry.py

      - name: Set up Go for worker agent image
        uses: actions/setup-go@v5
        with:
          go-version-file: semantic-map/go/go.mod
          cache-dependency-path: semantic-map/go/go.sum

      - name: Set up Docker Buildx for smoke images
        uses: docker/setup-buildx-action@v3

      - name: Build telemetry-writer image
        uses: docker/build-push-action@v6
        with:
          context: poc2/system/telemetry-writer
          load: true
          tags: smoke/telemetry-writer:test
          cache-from: type=gha,scope=kind-telemetry-writer,timeout=3m
          cache-to: type=gha,mode=max,scope=kind-telemetry-writer,timeout=3m,ignore-error=true

      - name: Build dataset-collector image
        uses: docker/build-push-action@v6
        with:
          context: poc2/system/dataset-collector
          load: true
          tags: smoke/dataset-collector:test
          cache-from: type=gha,scope=kind-dataset-collector,timeout=3m
          cache-to: type=gha,mode=max,scope=kind-dataset-collector,timeout=3m,ignore-error=true

      - name: Build worker agent binary
        working-directory: semantic-map/go
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p cmd/agent/tmp
          go build -o cmd/agent/tmp/di-agent-poc ./cmd/agent/

      - name: Build worker agent image
        uses: docker/build-push-action@v6
        with:
          context: semantic-map
          load: true
          tags: smoke/di-agent:test
          cache-from: type=gha,scope=kind-di-agent,timeout=3m
          cache-to: type=gha,mode=max,scope=kind-di-agent,timeout=3m,ignore-error=true

      - name: Load images into kind
        run: |
          set -euo pipefail
          for service in telemetry-writer dataset-collector di-agent; do
            kind load docker-image "smoke/${service}:test" --name di-agent-smoke
          done

      - name: Create external smoke-test Secrets
        if: matrix.credentials == 'external'
        run: |
          kubectl create secret generic influxdb-credentials \
            --from-literal=admin-user=admin \
            --from-literal=admin-password=smoke-test-password \
            --from-literal=admin-token=smoke-test-token
          kubectl create secret generic grafana-credentials \
            --from-literal=admin-user=admin \
            --from-literal=admin-password=smoke-test-password

      - name: Helm install (values pointed at locally-loaded images)
        env:
          CREDENTIALS: ${{ matrix.credentials }}
        run: |
          values=()
          if [[ "$CREDENTIALS" == external ]]; then
            values=(-f poc2/cloud/helm-values.yaml)
          fi
          helm upgrade --install di-agent-system poc2/helm/di-agent-system "${values[@]}" \
            --set global.imageRegistry=smoke \
            --set global.imageTag=test \
            --set global.imagePullPolicy=IfNotPresent \
            --set kafka.persistence.enabled=false \
            --set influxdb.persistence.enabled=false \
            --set postgres.enabled=false \
            --set streamer.enabled=false \
            --set agent.datasetNodeName=di-agent-smoke-worker \
            --set prometheus.persistence.enabled=false \
            --wait --timeout 6m0s

      - name: Verify three worker agents and register their peer mesh
        run: |
          kubectl rollout status daemonset/di-agent --timeout=180s
          kubectl get daemonset di-agent -o json | python3 -c '
          import json, sys
          status = json.load(sys.stdin)["status"]
          assert status["desiredNumberScheduled"] == 3, status
          assert status["numberReady"] == 3, status
          assert status.get("numberMisscheduled", 0) == 0, status
          '
          bash poc2/scripts/04-peers.sh
          pods=$(kubectl get pods -l app=di-agent -o jsonpath='{.items[*].metadata.name}')
          dataset_agents=0
          for pod in $pods; do
            count=$(kubectl exec "$pod" -c di-agent -- curl -fsS http://localhost:9090/collectors \
              | python3 -c 'import json,sys; print(sum(c["name"] == "dataset" for c in json.load(sys.stdin)["collectors"]))')
            dataset_agents=$((dataset_agents + count))
          done
          test "$dataset_agents" -eq 1

      - name: Smoke-test default dataset collector
        run: |
          set -euo pipefail
          trap 'kubectl delete pod smoke-curl --ignore-not-found --wait=false' EXIT
          kubectl run smoke-curl --image=curlimages/curl --restart=Never \
            --command -- sleep 3600
          kubectl wait --for=condition=Ready pod/smoke-curl --timeout=60s
          for i in $(seq 1 12); do
            if kubectl exec smoke-curl -- curl -fsS --max-time 10 http://dataset-collector:8000/ready \
                | tee /tmp/collector-ready.json \
                | grep -q '"connected":true'; then
              cat /tmp/collector-ready.json
              exit 0
            fi
            echo "dataset-collector not ready yet, retrying (${i}/12)..."
            sleep 5
          done
          echo "::error::default dataset-collector never became ready"
          exit 1

      - name: Test Kafka telemetry through agent and InfluxDB
        run: python3 poc2/scripts/e2e_telemetry.py

      - name: Build replay-streamer image
        if: matrix.credentials == 'demo'
        uses: docker/build-push-action@v6
        with:
          context: poc2/system/replay-streamer
          load: true
          tags: smoke/replay-streamer:test
          cache-from: type=gha,scope=kind-replay-streamer,timeout=3m
          cache-to: type=gha,mode=max,scope=kind-replay-streamer,timeout=3m,ignore-error=true

      - name: Build playground image
        if: matrix.credentials == 'demo'
        uses: docker/build-push-action@v6
        with:
          context: poc2/playground
          load: true
          tags: smoke/playground:test
          cache-from: type=gha,scope=kind-playground,timeout=3m
          cache-to: type=gha,mode=max,scope=kind-playground,timeout=3m,ignore-error=true

      - name: Load replay and playground images into kind
        if: matrix.credentials == 'demo'
        run: kind load docker-image smoke/replay-streamer:test smoke/playground:test --name di-agent-smoke

      - name: Install PostgreSQL and load the replay fixture
        if: matrix.credentials == 'demo'
        run: |
          helm upgrade di-agent-system poc2/helm/di-agent-system --reuse-values \
            --set postgres.enabled=true \
            --set postgres.persistence.enabled=false \
            --set postgres.ingest.enabled=false \
            --wait --timeout 6m0s
          kubectl exec -i postgres-0 -- psql -U di -d engine -v ON_ERROR_STOP=1 \
            < poc2/scripts/e2e_replay_fixture.sql

      - name: Install replay and playground
        if: matrix.credentials == 'demo'
        run: |
          helm upgrade di-agent-system poc2/helm/di-agent-system --reuse-values \
            --set streamer.enabled=true \
            --set streamer.mode=real \
            --set streamer.runId=ci-replay \
            --set streamer.intervalMs=500 \
            --set playground.enabled=true \
            --set playground.dataset.enabled=true \
            --wait --timeout 6m0s

      - name: Test replay through agent and InfluxDB
        if: matrix.credentials == 'demo'
        run: python3 poc2/scripts/e2e_telemetry.py --replay

      - name: Set up Node.js for live playground test
        if: matrix.credentials == 'demo'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: poc2/playground/package-lock.json

      - name: Install playground test dependencies
        if: matrix.credentials == 'demo'
        working-directory: poc2/playground
        run: npm ci

      - name: Test playground against live replay
        if: matrix.credentials == 'demo'
        working-directory: poc2/playground
        run: |
          set -euo pipefail
          kubectl port-forward svc/playground 4173:80 > "$RUNNER_TEMP/playground-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              CYPRESS_baseUrl=http://127.0.0.1:4173 npm run cy:run:live:dataset
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/playground-forward.log"
          echo "::error::playground port-forward did not become ready"
          exit 1

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl logs -l app=dataset-collector --all-containers --tail=200 || true
          kubectl logs -l app=telemetry-writer --all-containers --tail=200 || true
          kubectl logs -l app=di-agent -c di-agent --tail=200 --max-log-requests=10 || true
          kubectl logs -l app=replay-streamer --all-containers --tail=200 || true

      - name: Upload live Cypress screenshots on failure
        if: failure() && matrix.credentials == 'demo'
        uses: actions/upload-artifact@v4
        with:
          name: playground-live-cypress-failure
          path: poc2/playground/cypress/screenshots/
          if-no-files-found: ignore

  build-push-images:
    name: build + push images (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, system-tests, kind-smoke-test, playground-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: genset
            context: poc2/system/genset
          - service: switchboard
            context: poc2/system/switchboard
          - service: propulsion
            context: poc2/system/propulsion
          - service: battery
            context: poc2/system/battery
          - service: shore-power
            context: poc2/system/shore-power
          - service: auxload
            context: poc2/system/auxiliary-load
          - service: telemetry-writer
            context: poc2/system/telemetry-writer
          - service: playground
            context: poc2/playground
          - service: data-ingest
            context: poc2/data-ingest
          - service: replay-streamer
            context: poc2/system/replay-streamer
          - service: dataset-collector
            context: poc2/system/dataset-collector
          - service: telemetry-cloud-sync
            context: poc2/system/telemetry-cloud-sync
          - service: navigation
            context: poc2/system/navigation
          - service: di-agent
            context: semantic-map

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize package owner
        id: package-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Go for agent image
        if: matrix.service == 'di-agent'
        uses: actions/setup-go@v5
        with:
          go-version-file: semantic-map/go/go.mod
          cache-dependency-path: semantic-map/go/go.sum

      - name: Build agent binary for image
        if: matrix.service == 'di-agent'
        working-directory: semantic-map/go
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p cmd/agent/tmp
          go build -o cmd/agent/tmp/di-agent-poc ./cmd/agent/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.package-owner.outputs.owner }}/${{ matrix.service }}:latest
            ghcr.io/${{ steps.package-owner.outputs.owner }}/${{ matrix.service }}:${{ github.sha }}
          # Links the image to this repo so GITHUB_TOKEN keeps write access to the package.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
