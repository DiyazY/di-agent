name: CI

# Runs on every push to main and every PR targeting main.
# Validates that the semantic-map Go module builds, vets clean, and that
# the full test suite (compliance + scenarios + evolution + integration)
# passes with race detection on. Also runs the poc2/system pytest suite, the
# poc2/bdd godog scenarios (fake in-process peers, no live cluster), the
# poc2/playground Cypress suite (stubbed spec only, no live cluster), and a
# kind-based Helm smoke test that deploys the full di-agent-system chart to
# an ephemeral in-runner cluster.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test + vet
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: semantic-map/go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: semantic-map/go/go.mod
          cache: true
          cache-dependency-path: semantic-map/go/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod / go.sum need 'go mod tidy'"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector, 5m timeout)
        run: go test -race -timeout 5m ./...

      # The example plugin is certified by the same suite every Go collector
      # passes, through the agent's real exec adapter. Linux only: it reads /proc.
      - name: Certify example collector plugin (loadavg)
        run: go run ./cmd/mapctl collector check --exec ../examples/collectors/loadavg/loadavg.py

      # The shell template from docs/collectors.md, so the guide's smallest example
      # is held to the same rule as the others.
      - name: Certify example collector plugin (shell)
        run: go run ./cmd/mapctl collector check --exec ../examples/collectors/shell/load1.sh

      # The Python SDK's own unit tests: standard library unittest, no install.
      - name: Test Python collector SDK
        working-directory: semantic-map/sdk/python
        run: python3 -m unittest -v test_di_collector

  demo:
    name: dev.sh demo (smoke)
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: semantic-map/go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: semantic-map/go/go.mod
          cache: true
          cache-dependency-path: semantic-map/go/go.sum

      - name: Run guided demo in paper mode
        run: ./dev.sh demo --paper

  system-tests:
    name: poc2/system pytest suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: poc2/system/**/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          for req in poc2/system/*/requirements.txt; do
            pip install -r "$req"
          done

      - name: Run pytest
        run: pytest poc2/system/tests/

  kind-smoke-test:
    name: kind Helm smoke test (di-agent-system chart)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          cluster_name: di-agent-smoke

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build chart-managed images
        run: |
          set -euo pipefail
          declare -A contexts=(
            [telemetry-writer]=poc2/system/telemetry-writer
            [dataset-collector]=poc2/system/dataset-collector
          )
          for service in "${!contexts[@]}"; do
            docker build -t "smoke/${service}:test" "${contexts[$service]}"
          done

      - name: Load images into kind
        run: |
          set -euo pipefail
          for service in telemetry-writer dataset-collector; do
            kind load docker-image "smoke/${service}:test" --name di-agent-smoke
          done

      - name: Create required secrets
        run: |
          kubectl create secret generic influxdb-credentials \
            --from-literal=admin-user=admin \
            --from-literal=admin-password=smoke-test-password \
            --from-literal=admin-token=smoke-test-token
          kubectl create secret generic grafana-credentials \
            --from-literal=admin-user=admin \
            --from-literal=admin-password=smoke-test-password

      - name: Helm install (values pointed at locally-loaded images)
        run: |
          helm upgrade --install di-agent-system poc2/helm/di-agent-system \
            --set global.imageRegistry=smoke \
            --set global.imageTag=test \
            --set global.imagePullPolicy=IfNotPresent \
            --set kafka.persistence.enabled=false \
            --set influxdb.persistence.enabled=false \
            --set postgres.enabled=false \
            --set streamer.enabled=false \
            --set prometheus.persistence.enabled=false \
            --wait --timeout 6m0s

      - name: Smoke-test default dataset collector
        run: |
          set -euo pipefail
          trap 'kubectl delete pod smoke-curl --ignore-not-found --wait=false' EXIT
          kubectl run smoke-curl --image=curlimages/curl --restart=Never \
            --command -- sleep 3600
          kubectl wait --for=condition=Ready pod/smoke-curl --timeout=60s
          for i in $(seq 1 12); do
            if kubectl exec smoke-curl -- curl -fsS --max-time 10 http://dataset-collector:8000/ready \
                | tee /tmp/collector-ready.json \
                | grep -q '"connected":true'; then
              cat /tmp/collector-ready.json
              exit 0
            fi
            echo "dataset-collector not ready yet, retrying (${i}/12)..."
            sleep 5
          done
          echo "::error::default dataset-collector never became ready"
          exit 1

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app=dataset-collector --all-containers --tail=200 || true

  build-push-images:
    name: build + push images (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: genset
            context: poc2/system/genset
          - service: switchboard
            context: poc2/system/switchboard
          - service: propulsion
            context: poc2/system/propulsion
          - service: battery
            context: poc2/system/battery
          - service: shore-power
            context: poc2/system/shore-power
          - service: auxload
            context: poc2/system/auxiliary-load
          - service: telemetry-writer
            context: poc2/system/telemetry-writer
          - service: playground
            context: poc2/playground
          - service: data-ingest
            context: poc2/data-ingest
          - service: replay-streamer
            context: poc2/system/replay-streamer
          - service: dataset-collector
            context: poc2/system/dataset-collector

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/chuducanh242002/${{ matrix.service }}:latest
            ghcr.io/chuducanh242002/${{ matrix.service }}:${{ github.sha }}
          # Links the image to this repo so GITHUB_TOKEN keeps write access to the package.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
