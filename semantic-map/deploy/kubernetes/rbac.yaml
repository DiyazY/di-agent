# What the di-agent `kubernetes` runtime needs: list pods, and resize a pod's
# CPU limit in place. Nothing else: what a change replaced is kept in the
# agent's own ledger, not on the pod.
# The DaemonSet that runs the agent is in daemonset.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: di-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: di-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: di-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: di-agent
subjects:
  - kind: ServiceAccount
    name: di-agent
    namespace: kube-system
