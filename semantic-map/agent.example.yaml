node:
    addr: :8080
    id: ""
    ingest_scope: self
profile:
    name: edge-minimal
    kd: ""
    priors: ""
    regime: ""
    alpha: 0.2
    alpha_slow: 0.001
    convergence: 500
    min_trust: 0.5
sources:
    interval: 10s
    # The list is the whole set: naming collectors replaces this default, it does not
    # add to it. Order is ownership priority for node-level metric types. Each entry
    # names exactly one of type (built-in), exec (a plugin process) or http (a plugin
    # URL); config is the collector's own, and an unknown key in it is refused.
    collectors:
        - name: cgroup
          type: cgroup
          # config, at its defaults:
          #   root: /sys/fs/cgroup
          #   subjects: true
          #   units: []
          #   max_subjects: 256
          #   cmd_label: false
          #   pod_logs: /var/log/pods
        # Netdata beside cgroup: collapse: false leaves the node's own types
        # (cpu_utilization and the rest) to cgroup, listed first.
        # - name: netdata
        #   type: netdata
        #   config:
        #     url: http://localhost:19999
        #     include: [system.cpu, system.ram, system.io, system.net, disk.io, disk.util, disk.await, net.net, cpu.cpu]
        #     collapse: false
        # An out-of-process plugin (README §3, sources.collectors):
        # - name: loadavg
        #   exec: {command: /opt/di/collectors/loadavg, args: []}
        #   timeout: 3s
        # A synthetic system (exclusive: it must be the only entry):
        # - name: script
        #   type: script
        #   config: {path: scenarios/demo.json}
facts:
    - kind: host
      root: ""
map:
    proposer:
        enabled: true
        threshold: 0.85
        min_pairs: 30
        min_spread: 0.01
        fdr: 0.05
        max_pairs: 0
    pair_window: 15s
    pair_support: 0
    pair_history: 0
    stale_after: 2m0s
    retire_after: 10m0s
    learn: true
    admit: true
    sweep_interval: 0s
    journal_size: 0
    tuner: true
persist:
    file: /var/lib/di-agent/state.json
    interval: 1m0s
peers:
    urls: []
    state_poll: 30s
    state_stale: 1m30s
domain:
    path: ""
explain:
    provider: none
    url: http://localhost:11434/v1
    model: qwen2.5:7b-instruct
    prompt: ""
    api_key: ""
    planner_prompt: ""
    critic_prompt: ""
    keep_alive: 30m
    sessions: true
runtime:
    kind: dry-run
    kubeconfig: ""
    node: ""
actuation:
    # "": actions.json beside persist.file.
    ledger: ""
loops:
    review:
        level: full
        interval: 1m0s
        per_cycle: 10
        rules:
            - composition
        renderer: text
        thresholds:
            confirm: 0.85
            reject: 0.95
            defer: 0.7
        decision:
            backend: systemone
            url: http://localhost:11434
            model: tev1:4b
            keep_alive: ""
            reasoning_effort: none
            api_key: ""
            timeout: 5m0s
        reasoning:
            backend: openai-tools
            url: http://localhost:11434/v1
            model: qwen3.8:27b-nvfp4
            keep_alive: 10m
            tools:
                - get_property
                - get_state
                - get_candidates
            api_key: ""
            timeout: 10m0s
    relief:
        enabled: false
        interval: 15s
        # null: a dry run exactly when runtime.kind is dry-run; true on kubernetes
        # decides, records and verifies, and changes nothing.
        dry_run: null
        # One relief loop per lever, an action and its thresholds; the loops share
        # max_actions_per_hour and each workload's cooldown.
        levers:
            - action: cpu.limit
              enter: 0.25
              exit: 0.1
              enter_for: 1m0s
              exit_for: 3m0s
              step: 0.25
              min_effect: 0.03
              victim_share: 0.05
              settle: 2m0s
              expiry: 1h0m0s
            # memory_contention_ratio: memory stall of pods within their request.
            # Needs cgroup v2 and the kubelet's MemoryQoS off (OPERATING.md).
            - action: memory.high
              enter: 0.2
              exit: 0.05
              enter_for: 1m0s
              exit_for: 3m0s
              step: 0.25
              min_effect: 0.03
              victim_share: 0.05
              settle: 2m0s
              expiry: 1h0m0s
policy:
    defaults:
        allow:
            - cpu.limit
            - memory.high
        deny:
            - evict
        floor:
            cpu.limit:
                min: 0.1
                of_original: 0.5
            memory.high:
                min: 67108864 # 64 MiB, in bytes
                of_original: 0
        max_actions_per_hour: 6
        cooldown: 10m0s
    rules:
        - match:
            kind: ""
            name: ""
            labels:
                di-agent/freeze:
                    - "true"
          freeze: true
          allow: []
          deny: []
          max_actions_per_hour: 0
          cooldown: 0s
        - match:
            kind: ""
            name: ""
            labels:
                k8s/priority-class:
                    - system-node-critical
                    - system-cluster-critical
          freeze: true
          allow: []
          deny: []
          max_actions_per_hour: 0
          cooldown: 0s
groups:
    interval: 30s
    label_keys:
        - di-agent/group
        - app.kubernetes.io/part-of
    units:
        system:
            - '*'
