# A steady CPU load for P4: six busy loops under a 4.5-core limit, so with the victim
# beside it the node's six pod CPUs are oversubscribed (1.5x, as on the 4-CPU node). The
# kernel's cpu.weight still gives the victim its share, so the hog's wait is its own and
# CPU relief leaves it alone. Burstable, one container, with a
# CPU limit: the kind of pod the kubernetes runtime will resize in place.
apiVersion: v1
kind: Pod
metadata: { name: hog, labels: { check: casestudy, di-agent/group: relief } }
spec:
  containers:
  - name: w
    image: busybox:1.36
    command: ["sh", "-c", "for i in 1 2 3 4 5 6; do (while :; do :; done) & done; wait"]
    resources: { requests: { cpu: 100m, memory: 8Mi }, limits: { cpu: "4500m", memory: 32Mi } }
